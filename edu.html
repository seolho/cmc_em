<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>📝보수교육 제목 입력</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <div class="card shadow rounded-4">
        <div class="card-body">
          <h4 class="card-title text-center mb-4">| 응급간호팀 4월 보수교육 입력 |</h4>

          <form id="searchForm" class="mb-4">
            <div class="mb-3">
              <label for="name" class="form-label">📢이름으로 조회 후 입력하세요</label>
              <input type="text" class="form-control" id="name" list="nameSuggestions" autocomplete="off" required />
              <datalist id="nameSuggestions">
                <option value="권순두" />
                <option value="송성연" />
                <option value="김은비" />
                <option value="구미숙" />
                <option value="임수영" />
                <option value="조현미" />
                <option value="서주원" />
                <option value="이지은" />
                <option value="박지혜" />
                <option value="장지나" />
                <option value="김민경" />
                <option value="정가운" />
                <option value="권수민" />
                <option value="류지은" />
                <option value="박유림" />
                <option value="양승빈" />
                <option value="김송하" />
                <option value="하유진" />
              </datalist>
            </div>
            <button type="submit" class="btn btn-primary w-100">🔎조회 하기</button>
          </form>

          <div id="resultArea" class="d-none">
            <div class="mb-3">
              <label class="form-label">📆교육일자</label>
              <input type="text" class="form-control" id="eduDate" readonly />
            </div>
            <div class="mb-3">
              <label for="title" class="form-label">📝보수교육 제목 입력</label>
              <input type="text" class="form-control" id="title" placeholder="여기에 제목 입력 후 제출하세요" required />
            </div>
            <button id="submitBtn" class="btn btn-success w-100">🚀제출하기</button>
          </div>

          <div id="message" class="mt-3"></div>
          <div style="text-align: center;">
          <img src="https://www.cmcvincent.or.kr/images/common/top_logo.png">
          </div>
        </div>
      </div>
    </div>

    <script>
      const SHEET_URL = "https://script.google.com/macros/s/AKfycbyA-Y8yPPLafHBut-Kr3753NxSTRTNh6pxBT1LuxexoWCvYlUTE0EVGkD2EcwhyI9Fu/exec";

      const searchForm = document.getElementById("searchForm");
      const resultArea = document.getElementById("resultArea");
      const eduDate = document.getElementById("eduDate");
      const titleInput = document.getElementById("title");
      const message = document.getElementById("message");
      const submitBtn = document.getElementById("submitBtn");

      searchForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const name = document.getElementById("name").value.trim();
        const searchBtn = searchForm.querySelector("button[type='submit']");

        searchBtn.disabled = true;
        const originalText = searchBtn.textContent;
        searchBtn.textContent = "🔄조회중.. 잠시 기다려주세요";

        try {
          const response = await fetch(`${SHEET_URL}?name=${name}`, {
            method: "GET",
          });
          const data = await response.json();

          if (data.success) {
            eduDate.value = data.eduDate;
            resultArea.classList.remove("d-none");
            message.textContent = "";
            searchBtn.disabled = false;
            searchBtn.textContent = "🔎조회 하기";
          } else {
            resultArea.classList.add("d-none");
            message.innerHTML = `<div class="alert alert-danger">${data.message}</div>`;
          }
        } catch (error) {
          console.error(error);
          message.innerHTML = `<div class="alert alert-danger">조회 실패. 다시 시도해주세요.</div>`;
        }
      });

      submitBtn.addEventListener("click", async () => {
        const name = document.getElementById("name").value.trim();
        const title = titleInput.value.trim();
        
        if (!title) {
          alert("보수교육 제목을 입력하세요.");
          return;
        }

        submitBtn.disabled = true;
        const originalSubmitText = submitBtn.textContent;
        submitBtn.textContent = "🔄제출중.. 잠시 기다려 주세요";
       
        try {
          const formData = new FormData();
          formData.append("name", name);
          formData.append("title", title);

          const response = await fetch(SHEET_URL, {
            method: "POST",
            body: formData,
          });

          const data = await response.json();

          if (data.success) {
            alert("🚀Success!!")
            message.innerHTML = `<div class="alert alert-success">${data.message}</div>`;
          } else {
            message.innerHTML = `<div class="alert alert-danger">${data.message}</div>`;
          }
        } catch (error) {
          console.error(error);
          message.innerHTML = `<div class="alert alert-danger">제출 실패. 다시 시도해주세요.</div>`;
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = originalSubmitText;
          }
      });
    </script>
  </body>
</html>
